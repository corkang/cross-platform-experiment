# EnvBench Python Native Cross-Platform Experiment
#
# Runs the EnvBench bash agent (inference → processing → evaluation) on
# native GitHub Actions runners for 10 pilot repos × 3 OS.
#
# Canonical manifest: manifests/selected_repos.jsonl
# Metric: pass@1 = (exit_code == 0) and (issues_count == 0)
#
# This workflow is separate from the heuristic setup workflow
# (envbench-python-matrix.yml) — do not merge or extend that file.

name: EnvBench Python Native

on:
  workflow_dispatch:
    inputs:
      hf_traj_repo_id:
        description: "HuggingFace trajectory dataset repo ID"
        required: true
        default: "corkang/EnvBench-multi-traj"
        # default: "JetBrains-Research/EnvBench-trajectories"

# ── Pinned versions ──────────────────────────────────────────────────
env:
  EXECUTION_MODE: native
  EVAL_TOOL: native
  PYTHON_VERSION: "3.12.8"
  NODE_VERSION: "20.18.0"
  UV_VERSION: "0.6.14"
  PYRIGHT_VERSION: "1.1.390"

jobs:
  # ================================================================
  # Job 0: prepare-matrix  (derive repo list from manifest)
  # ================================================================
  prepare-matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      repo-matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Generate repo matrix from manifest
        id: gen
        shell: bash
        run: |
          # Read manifests/selected_repos.jsonl and produce a JSON array
          # with repository, revision, safe_name for each entry.
          python3 -c "
          import json, sys
          rows = []
          with open('manifests/selected_repos.jsonl') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('//') or line.startswith('#'):
                      continue
                  entry = json.loads(line)
                  repo = entry['repository']
                  rev  = entry['revision']
                  safe = repo.replace('/', '__')
                  rows.append({'repository': repo, 'revision': rev, 'safe_name': safe})
          if not rows:
              raise SystemExit('selected_repos.jsonl produced an empty matrix')
          print(json.dumps(rows))
          " > repo_matrix.json
          echo "matrix=$(cat repo_matrix.json)" >> "$GITHUB_OUTPUT"
          echo "Generated matrix with $(python3 -c "import json; print(len(json.load(open('repo_matrix.json'))))" ) repos"

  # ================================================================
  # Job 1: experiment  (1 repo × 1 OS per job = N×3 jobs total)
  # ================================================================
  experiment:
    needs: prepare-matrix
    runs-on: ${{ matrix.os.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - { runs_on: windows-2022,  target_os: windows }
          # - { runs_on: ubuntu-22.04,  target_os: linux   }
          # - { runs_on: macos-14,      target_os: macos   }
        # Derived from manifests/selected_repos.jsonl via prepare-matrix job
        repo: ${{ fromJson(needs.prepare-matrix.outputs.repo-matrix) }}

    env:
      TARGET_OS: ${{ matrix.os.target_os }}
      RUN_NAME: "gha-python-bash-${{ matrix.os.target_os }}-${{ matrix.repo.safe_name }}-${{ github.run_id }}-${{ github.run_attempt }}"
      HF_TRAJ_REPO_ID: ${{ inputs.hf_traj_repo_id }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout experiment repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      # ── 2. Toolchain setup ──────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Prepare runtime paths
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            git config --global core.longpaths true
            DATA_ROOT="$RUNNER_TEMP/ed"
            TMP_ROOT="$RUNNER_TEMP/et"
          else
            DATA_ROOT="$GITHUB_WORKSPACE/data"
            TMP_ROOT="$GITHUB_WORKSPACE/tmp"
          fi

          mkdir -p "$DATA_ROOT" "$TMP_ROOT"
          echo "DATA_ROOT=$DATA_ROOT" >> "$GITHUB_ENV"
          echo "TMP_ROOT=$TMP_ROOT" >> "$GITHUB_ENV"

      # ── 3. Environment snapshot ─────────────────────────────────
      - name: Record environment snapshot
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          SNAP="$GITHUB_WORKSPACE/artifacts/environment_snapshot.txt"

          {
            echo "=== Runner ==="
            echo "runner.os:   ${{ runner.os }}"
            echo "runner.arch: ${{ runner.arch }}"
            echo "ImageOS:     ${ImageOS:-unknown}"
            echo "ImageVersion:${ImageVersion:-unknown}"
            echo ""
            echo "=== Toolchain ==="
            echo "python:  $(python --version 2>&1)"
            echo "node:    $(node --version 2>&1)"
            echo "bash:    $(bash --version | head -1)"
            echo "git:     $(git --version 2>&1)"
            echo "pip:     $(python -m pip --version 2>&1)"
            echo "uv:      $(uv --version 2>&1)"
            echo "pwd:     $(pwd)"
            echo "DATA_ROOT:${DATA_ROOT}"
            echo "TMP_ROOT: ${TMP_ROOT}"
            echo ""
            echo "=== Experiment ==="
            echo "EXECUTION_MODE: $EXECUTION_MODE"
            echo "TARGET_OS:      $TARGET_OS"
            echo "EVAL_TOOL:      $EVAL_TOOL"
            echo "RUN_NAME:       $RUN_NAME"
            echo "repository:     ${{ matrix.repo.repository }}"
            echo "revision:       ${{ matrix.repo.revision }}"
          } | tee "$SNAP"

      # ── 4. Install EnvBench dependencies ────────────────────────
      - name: Install EnvBench dependencies
        shell: bash
        run: |
          cd EnvBench
          uv venv
          # Activate: Unix path first, Windows fallback
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          uv sync
          # Install pinned pyright inside the venv via uv.
          # uv-managed virtualenvs may not include pip by default.
          uv pip install "pyright==$PYRIGHT_VERSION"
          echo "pyright: $(python -m pyright --version 2>&1)" >> "$GITHUB_WORKSPACE/artifacts/environment_snapshot.txt"

      # ── 5. Prepare single-repo local manifest ──────────────────
      - name: Prepare single-repo manifest
        shell: bash
        run: |
          mkdir -p "$TMP_ROOT"
          MANIFEST="$TMP_ROOT/local_manifest.jsonl"
          printf '{"repository": "%s", "revision": "%s"}\n' \
            "${{ matrix.repo.repository }}" \
            "${{ matrix.repo.revision }}" > "$MANIFEST"
          echo "Created local manifest:"
          cat "$MANIFEST"
          cp "$MANIFEST" "$GITHUB_WORKSPACE/artifacts/local_manifest.jsonl"

      # ── 6-8. Run full pipeline (inference → processing → eval) ─
      - name: Run EnvBench pipeline
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd EnvBench
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate

          python envbench.py --config-name python-bash \
            "run_name=${RUN_NAME}" \
            "tag=gha-python-bash" \
            "use_wandb=false" \
            "+fancy_output=false" \
            "inference_workers=1" \
            "eval_workers=1" \
            "data_path=${DATA_ROOT}" \
            "tmp_dir=${TMP_ROOT}" \
            "traj_repo_id=${HF_TRAJ_REPO_ID}" \
            "inference.data_source.type=local" \
            "inference.data_source.local.path=${TMP_ROOT}/local_manifest.jsonl" \
            "inference.docker.output_dir=${DATA_ROOT}/repos" \
            "inference.log_trajectory=true" \
            "inference.rewrite_trajectories=true" \
            "inference.logging_dir=${TMP_ROOT}/trajectories-${RUN_NAME}" \
            "inference.max_concurrent=1" \
            "evaluation.eval_tool=native" \
            "evaluation.operation.dirs.tmp=${TMP_ROOT}/tmp-${RUN_NAME}" \
            "evaluation.operation.dirs.repo_data=${DATA_ROOT}/repo-data" \
            "evaluation.operation.dirs.json_results=${TMP_ROOT}/tmp-${RUN_NAME}/results/json" \
            "evaluation.operation.dirs.eval_results=${TMP_ROOT}/tmp-${RUN_NAME}/results/eval" \
            "evaluation.operation.pool_config.max_workers=1"

      # ── 9. Collect local results ────────────────────────────────
      - name: Collect results
        if: always()
        shell: bash
        run: |
          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"

          # Copy trajectories
          TRAJ_DIR="$TMP_ROOT/trajectories-${RUN_NAME}"
          if [ -d "$TRAJ_DIR" ]; then
            cp -r "$TRAJ_DIR" "$ARTIFACTS/trajectories"
          fi

          # Copy results from tmp work directories
          find "$TMP_ROOT" -name "results.jsonl" -exec cp {} "$ARTIFACTS/" \; 2>/dev/null || true
          find "$TMP_ROOT" -name "scripts.jsonl" -exec cp {} "$ARTIFACTS/" \; 2>/dev/null || true

          # Copy any JSON results from evaluation
          find "$TMP_ROOT" -path "*/results/json/*.json" -exec cp {} "$ARTIFACTS/" \; 2>/dev/null || true

          # Write job metadata
          cat > "$ARTIFACTS/job_metadata.json" <<METADATA_EOF
          {
            "repository": "${{ matrix.repo.repository }}",
            "revision": "${{ matrix.repo.revision }}",
            "safe_name": "${{ matrix.repo.safe_name }}",
            "target_os": "${{ matrix.os.target_os }}",
            "runs_on": "${{ matrix.os.runs_on }}",
            "run_name": "${RUN_NAME}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}"
          }
          METADATA_EOF

          echo "Artifacts collected:"
          ls -la "$ARTIFACTS/" || true

      # ── 10. Upload artifacts ────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: "result-${{ matrix.os.target_os }}-${{ matrix.repo.safe_name }}"
          path: artifacts/
          retention-days: 30

  # ================================================================
  # Job 2: aggregate  (merge all experiment results)
  # ================================================================
  aggregate:
    needs: experiment
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all experiment artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: all-results/
          pattern: "result-*"

      - name: Aggregate results
        shell: bash
        run: |
          python scripts/aggregate_results.py \
            --input-dir all-results \
            --output-dir aggregated

      - name: Upload aggregated results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: aggregated-results
          path: aggregated/
          retention-days: 90
